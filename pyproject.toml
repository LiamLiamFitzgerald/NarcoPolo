[project]
name = "narcopolo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas>=3",  # the codebase relies on pandas 3 (string dtype, copy-on-write); some clients cap it below 3
    "geopandas",
    "pandera",
    "pyarrow",
    "pyproj",
    "pywebview",
    "pyyaml",
    "scipy",
    "shapely",
    "statsmodels",
    "rasterio>=1.5.2",
    "netcdf4>=1.7.5.1.post1",
    "cdsapi>=0.7.7",
    "openeo>=0.47.0",
]

[dependency-groups]
dev = ["pandas-stubs", "types-pyyaml", "pytest", "ruff", "basedpyright", "tach"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts", ".claude"]  # tooling scripts, not pipeline code

[tool.pytest.ini_options]
testpaths = ["core/tests", "sim/tests", "validate/tests"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["core", "sim"]
