[project]
name = "narcopolo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "geopandas", "pandera", "pyarrow", "pyproj", "pywebview", "pyyaml", "scipy", "shapely", "statsmodels"]

[dependency-groups]
dev = ["pandas-stubs", "types-pyyaml", "pytest", "ruff", "basedpyright", "tach"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts", ".claude"]  # tooling scripts, not pipeline code

[tool.pytest.ini_options]
# every module folder, so each module's tests/ runs in make test and CI (#96)
testpaths = ["core", "sim", "validate", "ingest", "reference", "coverage", "detect", "match",
             "aggregate", "forecast", "detectors", "fuse", "patrol", "export", "dashboard"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["core", "sim", "validate", "ingest", "reference", "coverage", "detect", "match",
           "aggregate", "forecast", "detectors", "fuse", "patrol", "export", "dashboard"]
