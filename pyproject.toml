[project]
name = "narcopolo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "pyproj"]

[dependency-groups]
dev = ["pytest", "ruff", "basedpyright", "tach"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts", ".claude"]  # tooling scripts, not pipeline code

[tool.pytest.ini_options]
testpaths = ["core/tests"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["core"]
