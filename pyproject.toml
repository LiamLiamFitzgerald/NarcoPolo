[project]
name = "narcopolo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas>=3",  # the codebase relies on pandas 3 (string dtype, copy-on-write); some clients cap it below 3
    "geopandas",
    "pandera",
    "pyarrow",
    "pyproj",
    "pywebview",
    "pyyaml",
    "scipy",
    "shapely",
    "statsmodels",
    "rasterio>=1.5.2",
    "netcdf4>=1.7.5.1.post1",
    "cdsapi>=0.7.7",
    "openeo>=0.47.0",
]

[dependency-groups]
dev = ["pandas-stubs", "types-pyyaml", "pytest", "ruff", "basedpyright", "tach"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts", ".claude"]  # tooling scripts, not pipeline code

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib -p core.tests.isolation"  # importlib: test files may share a name; isolation: never touch real raw/ (#331)

[tool.basedpyright]
typeCheckingMode = "standard"
# every module but ingest (#185), detectors and fuse (#224) and patrol (#225); each joins once clean
include = [
    "core", "sim", "validate", "reference", "coverage", "detect", "match", "aggregate", "forecast",
    "export", "dashboard",
]
