[project]
name = "narcopolo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "pandera",
    "pyarrow",
    "pyproj",
    "pywebview",
    "pyyaml",
    "scipy",
    "shapely",
    "statsmodels",
    "rasterio>=1.5.2",
    "netcdf4>=1.7.5.1.post1",
]

[dependency-groups]
dev = ["pandas-stubs", "types-pyyaml", "pytest", "ruff", "basedpyright", "tach"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts", ".claude"]  # tooling scripts, not pipeline code

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"  # test files in different modules may share a name

[tool.basedpyright]
typeCheckingMode = "standard"
# every module; ingest joins once #185 is fixed
include = [
    "core", "sim", "validate", "reference", "coverage", "detect", "match", "aggregate", "forecast",
    "detectors", "fuse", "patrol", "export", "dashboard",
]
