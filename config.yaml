# Every threshold and global setting lives here; no module hardcodes them (docs/shared.md, Global settings).
seed: 20261127            # global; each use adds its own fixed number written next to it

region_bbox: {lon_min: -10.6, lon_max: -7.9, lat_min: 51.1, lat_max: 51.95}  # TODO(P3): trim to where inshore maps exist
# Grid origin: bbox min UTM x and y rounded down to a multiple of 10 000 m (2 km cells nest in 10 km cells)
x0: 380000
y0: 5660000

split:
  embargo_days: 7
  test_days: 7
  n_folds_slowdown: 12
  n_folds_small: 6

# P5 forecast (docs/specs/P5.md, Parameters; ewma_min_se from the EWMA step, issue #69)
ewma_delta: 0.97    # per day, half-life about 23 days
ewma_min_se: 3      # fine cell uses its 10 km parent's rate until S_E reaches this
interval: 0.9       # central interval level for lo90 / hi90
ship_history_days: 730   # T - 729 .. T, slowdowns (24 months)
radar_history_days: 90   # T - 89 .. T, dark_small

# P3 (docs/specs/P3.md, Parameters, table and pseudo-codebase; #85)
reference:
  lane_pct: 90               # lane = cell in the top 10% of fast-bin presence hours
  anchorage_share: 0.5       # slowest-bin share of the cell's presence hours
  anchorage_top_pct: 25      # ... and total hours in the top 25%
  port_buffer_m: 5000
  exclusion_grow_cells: 1    # port_zone | anchorage, grown by one cell
  static_share: 0.6          # bright in >= 60% of covering passes
  static_db: 10              # >= 10 dB over the local median
  static_bin_m: 50
  static_window_px: 41       # 41 x 41 median window
  static_grow_m: 100
  coast_buffer_m: 300
  min_sea_frac: 0.2          # keep a cell if at least 20% of it is sea
  sea_raster_m: 250
  boat_speed_kn: 15
  pier_road_m: 200           # road_access if a road is within 200 m
# P7 patrol (#89): docs/specs/P7.md Parameters. n_boot is left out: D3 removed the bootstrap exploration slot (#176)
patrol:
  top_sites: 15
  ship_kn: 12
  ship_budget_h: 24
  ship_dwell_h: 1
  aircraft_kn: 180           # TODO(P7): spec says "confirm with the team"
  aircraft_budget_h: 4
  aircraft_dwell_h: 0.2

# #103 (Liam, 28 Nov): plan start and base port, read by patrol. Until a human checks Haulbowline's position on a map,
# they stay commented out, so plans keep saying "stand-in" (and real data refuses). Then uncomment both:
# base_port: {lon: -8.32, lat: 51.84}   # TODO(P7) #103: approximate (from memory), Haulbowline, Cork Harbour
# patrol_start_hour_utc: 0              # TODO(P7) #103: plans start this many hours into the day after T

# #272 (Liam, 28 Nov): baseline per event type (D8)
forecast:
  model_by_type: auto        # choose GLM or EWMA per type on backtest folds before the evaluation window
  select_margin: 0           # the spec's rule: the higher mean skill wins

coverage:
  calm_wind_ms: 6            # provisional until the recall curve exists
  calm_hs_m: 1.5             # provisional
  storm_hs_m: 2.5            # A9 post_storm: >= storm_hours of hs > storm_hs_m ...
  storm_hours: 24
  storm_lookback_h: 72       # ... in the 72 h before the pass

# P2 ingest (#215, #221): proposed by P2; values from docs/specs/P2.md where noted, the rest TODO(P2)
ingest:
  era5_dataset: reanalysis-era5-single-levels            # TODO(P2): CDS catalogue id, see #216
  overpass_url: https://overpass-api.de/api/interpreter  # TODO(P2): see #216
  road_buffer_m: 200          # docs/specs/P2.md step 8: highway=* within 200 m = road access
  inshore_layers: {}          # TODO(P2): {layer_name: {url, licence}}: BIM / Marine Institute under-12 m net, pot, dredge (data.gov.ie)
  survey_extent: null         # TODO(P2): {url, licence}: survey extent polygon (shared.md issue 7)
  infomar_bathy: null         # TODO(P2): {url, licence}: licence must include INFOMAR's CC BY 4.0 attribution line
  s1_calm_share: 0.5          # docs/specs/P2.md: download a pass if >= 50% of the region cells it covers are calm
  s1_rough_passes: 5          # docs/specs/P2.md: plus 5 rough passes for P1's recall curve
  # #261 (Liam, 28 Nov): accepted as P2 checked them live on 2026-11-28 (not in the spec)
  s1_openeo_url: https://openeo.dataspace.copernicus.eu
  s1_catalogue_url: https://catalogue.dataspace.copernicus.eu/odata/v1/Products
  s1_product_type: IW_GRDH_1S
  s1_workers: 2   # TODO(P2): the openEO account's concurrent batch-job limit (#292)

# #212 (Liam, 28 Nov): a human fills every value from the GFW 4Wings docs; the real-data run waits for it
gfw:                         # TODO(P2): https://globalfishingwatch.org/our-apis/documentation#4wings-api
  chunk_days: null           # max days per 4Wings report request
  sar_matched: {"true": null, "false": null}   # label -> 4Wings filter for public-global-sar-presence:latest
  vessel_types: {cargo: null, carrier: null}   # #239: slowdowns use cargo (tankers assumed inside it) + carrier
  speed_bins: {}             # label -> filter on speed; P4 needs the "<2" bin, P3 a fast bin for lanes

validate:
  injection_match_m: 30      # docs/specs/P1.md, validate block: an injected spot is recovered if a candidate is within 30 m
  injection_brightness_db: [3, 6, 10, 15]  # TODO(P1): not in the spec; spans P4's threshold on the simulator
  injection_n_per_pass: 10   # TODO(P1): not in the spec
  injection_passes: 5        # TODO(P1): not in the spec; chips per run, keeps make validate quick
  visible_pickup_length_m: [15, 24]  # TODO(P1) #266: pick-ups the radar sees (sim p_det ~0.95 at 20 m) that match still counts as small or medium (25-50 m come out "large" and leave dark_small)
  fixed_target_history: 8    # TODO(P1) #334: passes in the per-pixel median (earlier passes only)
  fixed_target_p_fa: 1.0e-6  # TODO(P1) #334: candidate CFAR p_fa on the median-ratio image (a lower threshold than p4.p_fa)
  persistence_radius_m: 50   # #334: a candidate this close to a fixed target is on it (GFW's persistence radius, the cited start)
  power_rate_ratios: [2, 3]  # #351: rate ratios the power diagnostic asks about
  power_alpha: 0.001         # TODO(P1) #351: per-cell test level; the issue's illustration, not a NarcoPolo value
  power_min: 0.8             # TODO(P1) #351: a cell "can flag" when its power is at least this
  pboat_negative_m: 500      # docs/specs/P4.md (p_boat training): a negative is > 500 m from any injection or AIS ship
  quick:                     # #343: `make validate-quick`; the report says mode "quick" so it is never shown as the full result
    null_runs: 20            # TODO(P1): demo-speed value, not a calibrated choice (full: the spec's 200)
    n_folds_slowdown: 4      # TODO(P1): demo-speed value, not a calibrated choice (full: split.n_folds_slowdown)
    n_folds_small: 2         # TODO(P1): demo-speed value, not a calibrated choice (full: split.n_folds_small)
    policy_seeds: 1          # TODO(P1): demo-speed value, not a calibrated choice (full: learn.n_seeds_quick)
    visible_worlds: 0        # TODO(P1): demo-speed value, not a calibrated choice (full: 1; 0 skips recovery_visible_pickups)

detect_prob:                 # #349: small-boat detection-probability curve, fitted by validate.detect_prob on injected boats (coefficients go to reports/detect_prob.json, never here)
  form: [log_length_m, wind_ms, incidence_deg]  # #349: logit p = b0 + b1 log(length_m) + b2 wind_ms + b3 incidence_deg; a term missing from the data is dropped and named in the report
  length_bins_m: [0, 8, 12, 15, 24]  # TODO(P1) #365: the recall-curve bins of docs/specs/P1.md until a West Cork length mix is sourced
  length_weights: null       # TODO(P1) #365: no source gives the West Cork small-boat length mix; p-bar_detect stays null (unknown) until one does
  realism_anchor:            # Paolo et al. 2024 (Nature): Sentinel-1 thresholds calibrated to 60% recall at 15-20 m. Warning check only, never a tuning target
    length_m: [15, 20]
    recall: 0.6

# P4 detect and match (#183): docs/specs/P4.md Parameters and Steps; the same values as P4's code defaults
p4:
  pixel_m: 10                # shared.md issue 5: 10 m pixels on the fixed region grid
  land_buffer_m: 300         # CFAR step 1: land plus a 300 m buffer set to NaN
  cfar_outer: 41
  cfar_guard: 11
  p_fa: 1.0e-7               # then calibrated on the injection and null tests (CFAR step 4)
  cfar_calibration_target: null  # TODO(P4) #268: no value until a human decides the target (max false alarms per km2 per pass, or min recall at a named brightness in dB); until then p_fa stays 1e-7 (Liam, 28 Nov)
  enl: 4.4                   # estimate_enl default
  cluster_px: [1, 200]
  size_small_max_px: 4       # size_class: 1-4 small, 5-20 medium, > 20 large
  size_medium_max_px: 20
  pol_agree_m: 30
  radar_wavelength_m: 0.0555 # ghost rule: lambda ~ 5.55 cm
  ghost_db: 20
  ghost_tol_m: 200
  ghost_band_m: [4000, 8000] # ghost_offset_m when PRF is missing
  ais_window_min: 30
  match_gate_m: 500
  match_big_cost: 1000000000 # matching step 2: large finite cost
  presence_slow_kn: 2        # issue 3: slowest GFW presence bin
  slow_kn: 3
  cruise_kn: 8
  slow_min: 20
  storm_hs_m: 4
  rolling_median_min: 10     # slowdown step 2
  min_pings_cruise_hour: 3   # sparse AIS (Resolved ambiguities)
  min_pings_slow: 2
  slowdown_hour_utc: 12      # slowdowns_from_presence: 12:00 UTC of the date
  ship_types: [[70, 79], [80, 89]]  # cargo, tankers

sim:                      # docs/specs/P1.md, "Simulator defaults"
  days: 120
  beta0: -4
  beta1_inshore: 2
  beta2_lane: 1
  gamma: 0.3
  det_a: -4
  det_b: 0.4              # per metre of length
  det_c: 0.5              # per m/s of wind
  small_boat_length_m: [6, 15]
  pickup_length_m: [6, 15]       # TODO(P1) #266: pick-up boat length; = small_boat_length_m, validate's visible world overrides it
  false_alarm_per_km2_pass: 0.002
  drop_interval_days: 10
  pickup_prob: 0.8
  pickup_delay_days: [0.2, 4]
  # TODO(P1): the values below are not in the spec; chosen so the simulator has a rough and a calm world
  start_date: "2026-07-31"       # day 0; day 119 is 2026-11-27
  rough_wind_ms: 8               # a day at or above this wind is rough (P3 owns the real calm rule)
  rough_pickup_delay_prob: 0.7   # spec: 70% of rough-day pick-ups move to the next calm day
  ghost_offset_m: 3000           # azimuth-ambiguity offset for simulated ghosts
  boat_speed_kn: 15              # travel_hours = straight-line distance / this speed
  slowdown_rate_hot: 1.0         # ship slowdowns per cell-day in the anchorage and port zones
  slowdown_rate_cold: 0.01       # ... everywhere else
  pass_width_frac: [0.4, 0.8]    # share of the region (east-west) one pass covers
  seed_offsets: {map: 1, weather: 2, boats: 3, slowdowns: 4, pickups: 5, passes: 6, observe: 7, scenes: 8, raw: 9, sites: 10, fixed_targets: 11, fishing: 12, illegal_fishing: 13}
  p_detect_scenarios: [0.1, 0.4]  # TODO(P1) #351: detection probabilities for the power comparison runs (the issue's illustration)
  baseline_rate: 0.5             # TODO(P1) #351: placeholder small boats per cell-day for the comparison runs (issue's illustration)
  stand_in_sites: 15         # TODO(P1) #104: extra fuse/sites rows with no drops, so P7 has 16+ sites to rank and route
  site_gap_m: 4000           # A2: no site within 4 km of another
  fixed_targets:             # TODO(P1) #334: none of these are in the spec; a stack for the fixed-target suppression test
    size_px: 256             # 2.56 km square at 10 m
    n_passes: 16
    n_fixed: 30              # rocks, buoys, fish-farm cages: same pixels every pass
    fixed_db: 20             # peak over the sea mean, = sim/scenes.py SHIP_DB
    boats_per_pass: 15
    boat_db: [3, 12]         # small-boat peak over the sea mean at the two ends of pickup_length_m, linear in length
  # #346 fishing boats and planted illegal fishing (fisheries lens #321). TODO(P1): none of these values is in a spec;
  # chosen so the simulator has a steady medium-size fleet and an illegal-fishing surplus the weekly lens can find
  fishing_rate_inshore: 0.5      # TODO(P1): medium-size fishing boats per full-sea cell-day where inshore_frac = 1
  fishing_rate_offshore: 0.05    # TODO(P1): ... where inshore_frac = 0 (linear in between); a cell's rate x its sea_frac
  fishing_boat_length_m: [8, 12] # TODO(P1): the sim's "medium" size_class (8 <= L < 12 m, as its detection rows assign it)
  fishing_ais_frac: 0.2          # TODO(P1): share of normal fishing boats with AIS: matched, so no dark_medium event
  illegal_fishing_rate: 20       # TODO(P1): extra dark medium-size boats per full-sea cell-day inside the closure ...
  illegal_fishing_weeks: [12, 13, 14]  # TODO(P1): ... in these ISO weeks, counted from the first Monday (day 3, 2026-08-03)

# A10: each stage file is stamped with a hash of only the config keys it reads, so unrelated edits do not make it stale.
# Simulated files also hash `sim`. TODO(owners): each module adds the keys its stage really reads.
# P6 detectors and fuse (#123): docs/specs/P6.md Parameters, A1 and A3; the same values as P6's code defaults
p6:
  fdr_q: 0.1
  site_flags: false          # #269 (Liam, 28 Nov): the shift test falsely flags busy anchorages over the 90-day radar history; off until P6's exact per-site test + weighted BH replaces it
  gi_band_m: 2900            # binary Gi* weights: the 8 surrounding 2 km cells
  gi_perm: 999
  cusum_rho: 2               # A1
  cusum_h: 0.5               # TODO(P6): not in the spec (#124); D2 calibrates it on null-regime runs
  top_frac: 0.1
  inshore_max: 0.1           # context facts, docs/specs/P6.md step 4
  coast_min_m: 2000
  coast_max_m: 25000
  slow_hours_min: 0.33       # shared.md issue 3
  slow_hours_max: 3
  link_radius_m: 4000
  link_days: 7
  tau_days: 3
  half_life_days: 30
  shift_days: 60
  n_shuffles: 999
  pier_tau_h: 1

reads:
  reference/cells: [x0, y0, region_bbox, reference]
  reference/piers: [x0, y0, region_bbox, reference]
  reference/land: [x0, y0, region_bbox, reference]
  reference/closed_areas: [x0, y0, region_bbox, reference]   # #322
  reference/travel_hours: [x0, y0, region_bbox, reference]
  reference/presence_2km: [x0, y0, region_bbox, reference]
  coverage/weather_daily: [x0, y0, region_bbox, coverage]
  validate/pboat_training: [x0, y0, region_bbox, validate, p4]
  coverage/exposure: [x0, y0, region_bbox, coverage]
  detect/detections: [x0, y0, region_bbox]
  match/events: [x0, y0, region_bbox]
  aggregate/observed: [x0, y0, region_bbox, ship_history_days, radar_history_days]
  forecast/expected: [x0, y0, region_bbox, split, ewma_delta, ewma_min_se, interval]
  fuse/cells: [x0, y0, region_bbox]
  fuse/sites: [x0, y0, region_bbox]
  fuse/piers: [x0, y0, region_bbox]
  fuse/links: [x0, y0, region_bbox]
  fuse/fisheries: [x0, y0, region_bbox]   # #346: the same keys as fuse/sites

# Learning layer (docs/learning.md). Values not given by a source are TODO(P1): tune on train regimes only.
learn:
  regimes: {train: [fixed, two_sites], held_out: [pass_aware, displacing]}
  n_seeds: 20                 # TODO(P1)
  displace_km: 6              # TODO(P1)
  pass_buffer_h: 6            # TODO(P1)
  find_window_h: 24           # TODO(P1)
  p_find_ship: 0.8            # TODO(P1)
  p_find_aircraft: 0.5        # TODO(P1)
  alert_budget: 15            # = patrol.top_sites
  merge_kappa: 0.7            # TODO(P1)
  target_false_alerts: 1.0    # per week, TODO(P1)
  agents: [oe, midp, gi, cusum, link]  # until L2's merge list replaces it
  prior_strength: 5           # n0 virtual visits, TODO(P1)
  discount: 0.9               # per week, TODO(P1)
  exact_max_nodes: 16         # TODO(P1)
  exact_min_gain_pct: 0       # #229 (Liam, 28 Nov): keep the exact solver; it is never worse than greedy + 2-opt
  displace_visit_days: 14     # TODO(P1): sim only; `displacing` regime: the simulator's own patrol visits the active site this often
  attention_tau: 1.0          # TODO(P1): softness of regret-based CCT weights
  attention_floor: 0.05       # TODO(P1): minimum weight per merged group
  horizon_weeks: 4            # TODO(P1): season-layer look-ahead
  day_slots: 7                # days in the week layer
  min_week_share: 0.5         # TODO(P1): least share of the weekly budget any week gets
  n_regret_samples: 200       # TODO(P1): posterior draws for expected-regret exploration
  n_seeds_quick: 3            # make validate; n_seeds only for the final report
  train:                      # L4 fit (validate/train.py, #158); tune on train regimes only
    l2: 1.0                   # TODO(P1): rung 1 ridge penalty on standardised weights (scikit-learn C = 1)
    n_eff_min: 500            # L4 step 3 (Phillips et al.)
    pos_mult: 5               # L4 step 3: n_eff = min(n, pos_mult x positives)
    promote_se: 2             # L4 step 4: promote on a gain > promote_se x SE
    nam_hidden: 32            # TODO(P1): ReLU units per feature net (rung 2)
    nam_epochs: 300           # TODO(P1): full-batch Adam steps
    nam_lr: 0.01              # TODO(P1): Adam step size
    nam_l2: 0.001             # TODO(P1): weight decay
