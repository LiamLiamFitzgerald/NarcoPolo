<title>NarcoPolo</title>
<script>
// Resolve the theme before the first paint: the viewer's choice (light, dark, auto) or the system setting.
(() => {
  let pick = "auto";
  try { pick = localStorage.getItem("np-theme") || "auto"; } catch (e) { /* no storage: follow the system */ }
  const dark = pick === "dark" || (pick === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.mode = dark ? "dark" : "light";
  document.documentElement.dataset.pick = pick;
})();
</script>

<script>
// Plain JavaScript, inline SVG, no network. The browser only draws, sorts and formats: every number

const NS = "http://www.w3.org/2000/svg", W = 900;
const MAPS = {
  normal: { title: "Normal activity", long: "Normal small-boat activity", unit: "expected boats per unit of coverage (weekly mean of μ ÷ E)", div: false },
  obs_vs_exp: { title: "Observed vs expected", long: "Observed versus expected", unit: "log₂(observed ÷ expected), clipped at ±3 (8× more or less)", div: true },
  unusual: { title: "Unusual score", long: "Unusual score", unit: "U from 0 to 1 (weekly maximum, either event type)", div: false },
  exposure: { title: "Blind spots", long: "Blind spots", unit: "small-boat coverage summed over the week's passes", div: false },
};
const OVERLAYS = [
  ["backdrop", "Radar image"], ["inshore", "Inshore grounds"], ["lane", "Lanes and exclusion zones"], ["sites", "Drop sites"],

let snap, ext, H, timer = null, selected = null;
const view = { map: "normal", week: null, more: false };
const vb = { x: 0, y: 0, w: W, h: 260 }; // the map's current viewBox (#280)
const TOP_LIST = 3; // Design principle 13: a weekly top 3, the rest one click away
const AGREE_U = 0.9; // spec: agreement dots beside a cell with U >= 0.9
const REPLAY_MS = 1500; // one week per step when replaying
const KM_PER_DEG_LAT = 111.2; // mean length of a degree of latitude, for the scale bar only
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

// Icons: simple geometric paths drawn for this page, 24 x 24 grid, currentColor.
const ICONS = {
  light: "M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z",
  dark: "M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z",
  auto: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2v16a8 8 0 0 1 0-16z",
  info: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z",
  warning: "M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z",
  prev: "M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z",
  next: "M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z",
  play: "M8 5v14l11-7z",
  pause: "M6 19h4V5H6zm8-14v14h4V5z",
  empty: "M3 5h18v2H3zm0 6h12v2H3zm0 6h8v2H3z",
  plus: "M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z",
  minus: "M19 13H5v-2h14z",
  reset: "M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z",
  locate: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z",
};
const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;

async function loadSnapshot() {
  if (!window.pywebview?.api)
    await new Promise(r => { addEventListener("pywebviewready", r, { once: true }); setTimeout(r, 300); });
  if (window.pywebview?.api) return window.pywebview.api.get_snapshot();
  for (const url of ["/snapshot.json", "../data/export/snapshot.json"]) {
    try { const r = await fetch(url); if (r.ok) return r.json(); } catch (e) { /* try the next place */ }
  }
  throw new Error("no snapshot found");
}

// Equirectangular, east-west scaled by cos(latitude): accurate enough for 150 km.
const lonScale = () => Math.cos(((ext.lat0 + ext.lat1) / 2) * Math.PI / 180);
const unitsPerDeg = () => W / ((ext.lon1 - ext.lon0) * lonScale());
function project(lon, lat) {
  const k = lonScale(), s = unitsPerDeg();
  return [(lon - ext.lon0) * k * s, (ext.lat1 - lat) * s];
}

// Basemap features: the study-area outline, and the land (#133) when the reference layer exists.
const rings = f => (f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [f.geometry.coordinates]).flat();
const landRings = () => snap.basemap.features.filter(f => f.properties?.kind === "land").flatMap(rings);

function setExtent() {
  const g = Object.values(snap.cells.geometry), coast = landRings().flat();
  const lon = [...g.flatMap(b => [b[0], b[2]]), ...coast.map(p => p[0])], lat = [...g.flatMap(b => [b[1], b[3]]), ...coast.map(p => p[1])];
  const padLon = (Math.max(...lon) - Math.min(...lon)) * 0.03, padLat = (Math.max(...lat) - Math.min(...lat)) * 0.08;
  ext = { lon0: Math.min(...lon) - padLon, lon1: Math.max(...lon) + padLon, lat0: Math.min(...lat) - padLat, lat1: Math.max(...lat) + padLat };
  H = project(ext.lon0, ext.lat0)[1];
  Object.assign(vb, { x: 0, y: 0, w: W, h: H });
  applyView();
}

// SVG element; `tip` becomes the hover card's text (and the accessible name of focusable marks).
function el(tag, attrs, parent, tip) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (tip) e.dataset.tip = tip;
  parent.appendChild(e);
  return e;
}
const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const group = id => { const g = document.getElementById(id); g.replaceChildren(); return g; };
const cellRect = cid => {
  const b = snap.cells.geometry[cid], [x0, y1] = project(b[0], b[1]), [x1, y0] = project(b[2], b[3]);
  return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
};
const empty = (text, name = "empty") => { const d = h("div", { className: "empty" }); d.innerHTML = icon(name); d.append(text); return d; };
const pct = v => `${(100 * v).toFixed(0)}%`;
const fmt = (v, d = 2) => (v === null || v === undefined ? "–" : Number(v).toFixed(d));

// ---- hover cards: one tooltip for every [data-tip] on the map and in the charts (#280, #282) ----
function showTip(text, x, y) {
  const t = document.getElementById("tip");
  t.textContent = text;
  t.hidden = false;
  const r = t.getBoundingClientRect();
  t.style.left = `${Math.max(8, Math.min(x + 14, innerWidth - r.width - 8))}px`;
  t.style.top = `${y + 16 + r.height > innerHeight ? y - r.height - 10 : y + 16}px`;
}
const hideTip = () => { document.getElementById("tip").hidden = true; };
document.addEventListener("pointerover", e => { const t = e.target.closest?.("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointermove", e => { const t = e.target.closest?.("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointerout", e => { if (e.target.closest?.("[data-tip]")) hideTip(); });
document.addEventListener("focusin", e => { const t = e.target.closest?.("[data-tip]"); if (t) { const r = t.getBoundingClientRect(); showTip(t.dataset.tip, r.left + r.width / 2, r.bottom); } });
document.addEventListener("focusout", hideTip);

// ---- map view: zoom, pan, scale bar (#280). Only the viewBox changes; nothing is redrawn. ----
function applyView() {
  document.getElementById("svg").setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  if (ext) drawScale();
}
function clampView() {
  vb.w = Math.min(W, Math.max(W / 10, vb.w));
  vb.h = (vb.w * H) / W;
  vb.x = Math.min(W - vb.w, Math.max(0, vb.x));
  vb.y = Math.min(H - vb.h, Math.max(0, vb.y));
}
function zoomAt(f, cx, cy) {
  const w = vb.w / f;
  vb.x = cx - ((cx - vb.x) * w) / vb.w;
  vb.y = cy - ((cy - vb.y) * w) / vb.w;
  vb.w = w;
  clampView(); applyView();
}
function toMap(clientX, clientY) {
  const r = document.getElementById("svg").getBoundingClientRect();
  return [vb.x + ((clientX - r.left) / r.width) * vb.w, vb.y + ((clientY - r.top) / r.height) * vb.h];
}
// Glide to a target view (instant under reduced motion).
function flyTo(target) {
  if (reduced()) { Object.assign(vb, target); clampView(); applyView(); return; }
  const from = { ...vb }, t0 = performance.now(), dur = 450;
  const step = now => {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - (1 - t) * (1 - t) * (1 - t);
    for (const k of ["x", "y", "w"]) vb[k] = from[k] + (target[k] - from[k]) * e;
    clampView(); applyView();
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function panTo(lon, lat, zoom = 3) {
  const [x, y] = project(lon, lat), w = W / zoom;
  flyTo({ x: x - w / 2, y: y - (w * H) / W / 2, w });
}
function drawScale() {
  const svg = document.getElementById("svg"), px = svg.getBoundingClientRect().width || 1;
  const pxPerKm = (unitsPerDeg() / KM_PER_DEG_LAT) * (px / vb.w);
  let km = 1;
  for (const k of [0.5, 1, 2, 5, 10, 20, 50, 100]) if (k * pxPerKm <= 110) km = k;
  const bar = document.getElementById("scaleBar"), len = km * pxPerKm;
  bar.style.width = `${len}px`;
  bar.dataset.km = km; bar.dataset.px = len.toFixed(2);
  document.getElementById("scaleLabel").textContent = `${km} km`;
}
function setupMapView() {
  const wrap = document.getElementById("mapWrap"), pts = new Map();
  let moved = 0, pinch = null;
  wrap.addEventListener("wheel", e => { if (!snap) return; e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, ...toMap(e.clientX, e.clientY)); }, { passive: false });
  wrap.addEventListener("pointerdown", e => {
    if (!snap || e.target.closest(".map-tools")) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  wrap.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const [px, py] = pts.get(e.pointerId), r = document.getElementById("svg").getBoundingClientRect();
    if (pts.size === 1) {
      moved += Math.abs(e.clientX - px) + Math.abs(e.clientY - py);
      if (moved > 4) { wrap.setPointerCapture?.(e.pointerId); vb.x -= ((e.clientX - px) / r.width) * vb.w; vb.y -= ((e.clientY - py) / r.height) * vb.h; clampView(); applyView(); }
    }
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt(d / pinch, ...toMap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2)); pinch = d; moved = 99;
    }
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
  wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end);
  // a drag is not a click on the site under the pointer
  wrap.addEventListener("click", e => { if (moved > 4) { e.stopPropagation(); e.preventDefault(); } }, true);
  wrap.addEventListener("keydown", e => {
    if (!snap || e.target !== wrap) return;
    const step = vb.w * 0.1, keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (keys[e.key]) { e.preventDefault(); vb.x += keys[e.key][0]; vb.y += keys[e.key][1]; clampView(); applyView(); }
    if (e.key === "+" || e.key === "=") zoomAt(1.25, vb.x + vb.w / 2, vb.y + vb.h / 2);
    if (e.key === "-") zoomAt(0.8, vb.x + vb.w / 2, vb.y + vb.h / 2);
    if (e.key === "0") flyTo({ x: 0, y: 0, w: W });
  });
  document.getElementById("zin").onclick = () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
  document.getElementById("zout").onclick = () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
  document.getElementById("zreset").onclick = () => flyTo({ x: 0, y: 0, w: W });
  for (const [id, name] of [["zin", "plus"], ["zout", "minus"], ["zreset", "reset"]]) document.getElementById(id).innerHTML = icon(name);
  addEventListener("resize", () => { if (ext) drawScale(); });
}

// The Sentinel-1 radar backdrop (contract #263): only an embedded PNG, so a snapshot can never make the page
// load anything from the internet.
const backdrop = () => { const b = snap?.basemap?.backdrop; return typeof b?.image === "string" && b.image.startsWith("data:image/png;base64,") ? b : null; };

function seeThrough() {
  document.getElementById("svg").classList.toggle("see-through", !!backdrop() && isOn("backdrop"));
  if (snap) drawLegend(view.map, view.week);
}

function drawBasemap() {
  const g = group("base"), bd = backdrop();
  if (bd) {
    const [x0, y0] = project(bd.bounds[0], bd.bounds[3]), [x1, y1] = project(bd.bounds[2], bd.bounds[1]);
    const layer = el("g", { id: "ov-backdrop" }, g);
    layer.style.display = isOn("backdrop") ? "" : "none";
    el("image", { href: bd.image, x: x0, y: y0, width: x1 - x0, height: y1 - y0, preserveAspectRatio: "none" }, layer, bd.attribution);
  }
  const path = ring => "M" + ring.map(p => project(...p).join(",")).join("L") + "Z";
  for (const ring of landRings()) el("path", { d: path(ring), class: "land" }, g, "land");
  for (const f of snap.basemap.features.filter(f => f.properties?.kind !== "land"))
    for (const ring of rings(f)) el("path", { d: path(ring), class: "basemap" }, g);
}

// Unobserved is never the lowest colour of a scale (Design principle 4): it is grey hatching.
function hatchUnobserved() {
  const defs = document.querySelector("#svg defs");
  if (defs.querySelector("#hatch")) return;
  const pat = (id, bgClass, lineClass, w, rot) => {
    const p = el("pattern", { id, width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: `rotate(${rot})` }, defs);
    if (bgClass) el("rect", { width: 6, height: 6, class: bgClass }, p);
    el("line", { x1: 0, y1: 0, x2: 0, y2: 6, class: lineClass, "stroke-width": w }, p);
  };
  pat("hatch", "hatch-bg-svg", "hatch-line-svg", 2, 45); // not observed: grey, diagonal
  pat("lane", "", "lane-line-svg", 0.8, 90); // lanes and exclusion zones: thin, horizontal
}

// A value's colour token: one of 5 sequential steps by the snapshot's breaks, or one of 9 diverging steps.
function colour(name, v) {
  const lg = snap.cells.legends[name];
  if (MAPS[name].div) {
    const k = Math.round(Math.max(-1, Math.min(1, v / lg.clip)) * 4);
    return k === 0 ? "var(--div-0)" : `var(--div-${k < 0 ? "n" : "p"}${Math.abs(k)})`;
  }
  const n = lg.breaks.length - 1;
  let i = 0;
  while (i < n - 1 && v >= lg.breaks[i + 1]) i++;
  return `var(--seq-${n > 1 ? Math.round((i * 4) / (n - 1)) : 4})`;
}

const hatchedValue = (name, c) => c[name] === null || (name === "exposure" && !c.observed) || !snap.cells.legends[name].breaks.length;

function drawLegend(name, week) {
  const lg = snap.cells.legends[name], box = document.getElementById("legend");
  const head = h("div", { className: "title" }, `${MAPS[name].long}, week ${week}`);
  const unit = h("div", {}, MAPS[name].unit);
  if (!lg.breaks.length) {
    box.replaceChildren(head, unit, empty("Not available yet: every cell is hatched until the detectors provide this value.", "info"));
    return;
  }
  const row = h("div", { className: "row" });
  const key = (bg, label, cls = "") => { const s = h("span", { className: "sw " + cls }); if (bg) s.style.background = bg; row.append(h("span", { className: "key" }, s, label)); };
  if (MAPS[name].div) for (const t of [-1, -0.5, 0, 0.5, 1]) key(colour(name, t * lg.clip), (t * lg.clip).toFixed(1));
  else lg.breaks.slice(0, -1).forEach((b, i) => key(colour(name, b), `${b} to ${lg.breaks[i + 1]}`));
  key("", name === "exposure" ? "not observed (zero coverage)" : "not observed", "hatch");
  box.replaceChildren(head, unit, row);
  const bd = backdrop();
  if (bd && isOn("backdrop")) box.append(h("div", { className: "muted" },
    `Radar image: ${bd.attribution}${bd.from ? `, median of the passes from ${bd.from} to ${bd.to}` : ""}. ` +
    "Colours are see-through while it is on; turn it off for exact colours."));
}

function drawHeatmap(name, week) {
  hatchUnobserved();
  const g = group("heat");
  for (const c of snap.cells.weeks[week]) {
    const hatched = hatchedValue(name, c);
    const r = el("rect", { ...cellRect(c.cell_id), class: hatched ? "cell hatched" : "cell" }, g,
      hatched ? "Not observed this week" : `${MAPS[name].long}: ${Number(c[name]).toFixed(3)}`);
    if (!hatched) r.style.fill = colour(name, c[name]);
  }
  drawLegend(name, week);
}

// Cross-fade the heat layer when the map or the week changes (#278); instant under reduced motion.
function fadeHeat(draw) {
  const g = document.getElementById("heat");
  if (reduced()) { draw(); return; }
  g.classList.add("fading");
  setTimeout(() => { draw(); requestAnimationFrame(() => g.classList.remove("fading")); }, 150);
}

const isOn = id => document.getElementById("t-" + id)?.getAttribute("aria-pressed") !== "false";

function drawOverlays(first = false) {
  const root = group("over");
  const layer = id => { const g = el("g", { id: "ov-" + id }, root); g.style.display = isOn(id) ? "" : "none"; return g; };
  const L = snap.cells.layers;
  const inshore = layer("inshore");
  for (const cid of L.inshore) el("rect", { ...cellRect(cid), class: "inshore" }, inshore);
  const lanes = layer("lane");
  for (const cid of L.lane) el("rect", { ...cellRect(cid), class: "lane" }, lanes, "Shipping lane");
  for (const cid of L.exclusion) el("rect", { ...cellRect(cid), class: "exclusion" }, lanes, "Exclusion zone");

  const routes = layer("routes");
  for (const [asset, stops] of Object.entries(snap.plan)) {
    if (stops.length < 2) continue;
    // the ship's route draws itself on first load (#278)
    el("polyline", { points: stops.map(s => project(s.lon, s.lat).join(",")).join(" "), class: `route ${asset}${first && asset === "ship" ? " draw" : ""}`, pathLength: 1 }, routes,
      asset === "ship" ? "Ship route (by sea)" : "Aircraft sweep (straight lines)");
    if (asset !== "ship") continue;
    stops.forEach((s, i) => {
      if (i === 0 || i === stops.length - 1) return;
      const [x, y] = project(s.lon, s.lat), explore = isExplore(s);
      el("circle", { cx: x, cy: y, r: 9, class: explore ? "stop explore" : "stop" }, routes,
        `${explore ? "Exploration visit" : "Ship stop"}: ${s.id}, ${s.arrival_utc.slice(11, 16)} UTC, ${s.dwell_h} h on station`);
    });
  }

  const piers = layer("piers"), maxP = Math.max(0, ...snap.piers.map(p => p.P_j ?? 0));
  for (const p of snap.piers) {
    const [x, y] = project(p.lon, p.lat), r = p.P_j === null || !maxP ? 4 : 3 + 6 * p.P_j / maxP;
    const sq = el("rect", { x: x - r, y: y - r, width: 2 * r, height: 2 * r, class: "pier" }, piers, `${p.name ?? p.id}${p.P_j === null ? "" : `: pier score ${p.P_j.toFixed(2)}`}`);
    sq.dataset.id = p.id;
  }

  const sites = layer("sites"), follow = layer("followup"), agree = layer("agreement"), maxS = Math.max(...candidates().map(s => s.S), 1e-9);
  for (const s of candidates()) { // not all sites: a map of everything is not a plan
    const [x, y] = project(s.lon, s.lat), r = Math.max(5, 20 * s.S / maxS);
    const tip = `${s.id}: score ${s.S.toFixed(2)}, p ${s.p_perm.toFixed(3)}${s.bh_flag ? "" : ", not significant"}`;
    const g = el("g", { class: "site-g", tabindex: 0, role: "button", "aria-label": `${tip}. Show in the list` }, sites, tip);
    g.dataset.id = s.id;
    // ring, mark, thin edge: the orange stays visible over every heat-map colour (contrast relief)
    el("circle", { cx: x, cy: y, r, class: "site-ring" }, g);
    el("circle", { cx: x, cy: y, r, class: s.bh_flag ? "site flagged" : "site" }, g);
    el("circle", { cx: x, cy: y, r: r + 1.6, class: "site-edge" }, g);
    if (s.id === selected) { g.classList.add("selected"); el("circle", { cx: x, cy: y, r: r + 6, class: "sel-ring" }, g); }
    g.onclick = () => selectSite(s.id, { fromMap: true });
    g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectSite(s.id, { fromMap: true }); } };
    if (s.followup_unobserved > 0) {
      const dx = x + r + 7, dy = y - r - 7;
      el("polygon", { points: `${dx},${dy - 6} ${dx + 6},${dy} ${dx},${dy + 6} ${dx - 6},${dy}`, class: "diamond" }, follow, `${s.followup_unobserved} follow-up days unobserved`);
    }
    // D1 (#176): merged signal groups that flag the site, not the raw 0-4 count (its detectors share counts)
    const nm = s.agreement_merged ?? 0;
    for (let i = 0; i < nm; i++) el("circle", { cx: x + r + 6 + i * 7, cy: y + r + 4, r: 2.5, class: "dot" }, agree, `${nm} independent signal group(s) agree (angles, not proof)`);
  }
  for (const c of snap.cells.weeks[view.week]) { // beside cells rated U >= 0.9 this week: one dot per agreeing detector
    if (c.unusual === null || c.unusual < AGREE_U || !c.agreement) continue;
    const { x, y, width, height } = cellRect(c.cell_id);
    for (let i = 0; i < c.agreement; i++) el("circle", { cx: x + width + 2 + i * 4, cy: y + height / 2, r: 1.6, class: "dot" }, agree, `${c.agreement} of 4 detectors agree`);
  }
}

// The sites the patrol planner chose from (meta.top_sites, in D1 order); the map and the list draw these, not every site.
const candidates = () => [...snap.sites].sort(siteOrder).slice(0, snap.meta.top_sites);

// D1 (#176): p_site ranks sites (highest first), S breaks ties; sites without p_site come after, by S
function siteOrder(a, b) {
  const pa = a.p_site ?? null, pb = b.p_site ?? null;
  if (pa !== pb) return pa === null ? 1 : pb === null ? -1 : pb - pa;
  return b.S - a.S;
}
const isExplore = s => s.reason === "explore" || s.exploration === true;

// Selecting a site links the list and the map both ways (#280).
function selectSite(id, { fromMap = false } = {}) {
  selected = id;
  const s = snap.sites.find(q => q.id === id);
  if (!s) return;
  if (candidates().findIndex(q => q.id === id) >= TOP_LIST && !view.more) view.more = true;
  drawOverlays(); drawSiteList();
  const li = document.querySelector(`#sites li[data-id="${CSS.escape(id)}"]`);
  if (li) {
    if (fromMap) { li.querySelector("details").open = true; li.scrollIntoView({ block: "nearest", behavior: reduced() ? "auto" : "smooth" }); }
  }
  if (!fromMap) panTo(s.lon, s.lat);
}

function drawSiteList() {
  const ol = document.getElementById("sites");
  const pier = id => { const p = snap.piers.find(q => q.id === id); return p ? `${p.name ?? p.id}${p.P_j == null ? "" : ` (pier score ${p.P_j.toFixed(2)})`}` : id; };
  const items = candidates().slice(0, view.more ? undefined : TOP_LIST).map((s, i) => {
    const nm = s.agreement_merged;
    const lead = h("div", { className: "lead", title: nm == null ? "agreement not available yet" : `${nm} independent signal group(s) agree (angles, not proof)` }, String(i + 1));
    const badge = h("span", { className: "badge", title: lead.title }, nm == null ? "" : nm ? "●".repeat(nm) : "○");
    const locate = h("button", { type: "button", className: "link-btn state", title: "Show on the map" });
    locate.innerHTML = icon("locate"); locate.append("Map");
    locate.onclick = () => selectSite(s.id);
    const head = h("div", { className: "headline" }, h("span", {}, s.id), badge, h("span", { className: "muted" }, `score ${s.S.toFixed(2)} · p = ${s.p_perm.toFixed(3)}`));
    if (!s.bh_flag) head.append(h("span", { className: "tag" }, "not significant"));
    head.append(locate);
    const timeline = h("div");
    const more = h("details", {}, h("summary", { className: "state" }, "Why, and what to check"), timeline,
      h("ul", {}, ...s.reasons.slice(1).map(r => h("li", {}, r))),
      h("p", {}, `Seen ${s.recurrence} time${s.recurrence === 1 ? "" : "s"}` + (s.followup_unobserved ? `; follow-up unobserved on ${s.followup_unobserved} days` : "") +
        (s.top_piers.length ? `. Piers to check: ${s.top_piers.map(pier).join(", ")}.` : ".")));
    more.addEventListener("toggle", () => { if (more.open && !timeline.childElementCount) timeline.append(siteTimeline(s)); }); // built on first open
    const li = h("li", {}, lead, h("div", {}, head, h("div", { className: "supporting" }, s.reasons[0] ?? ""), more));
    li.dataset.id = s.id;
    li.style.animationDelay = `${Math.min(i, 10) * 30}ms`;
    if (s.id === selected) li.classList.add("selected");
    return li;
  });
  ol.replaceChildren(...items);
  if (!snap.sites.length) ol.replaceChildren(h("li", {}, h("span"), empty("No sites this week.")));
  const btn = document.getElementById("more"), n = candidates().length;
  btn.hidden = n <= TOP_LIST;
  btn.textContent = view.more ? `Show only the top ${TOP_LIST}` : `Show the ${n} patrol candidates (${snap.sites.length} sites in all)`;
}

// ---- chart foundation (#282): scales, ticks, axes, legend, card with a table view ----
const lin = (d0, d1, r0, r1) => v => r0 + ((v - d0) * (r1 - r0)) / ((d1 - d0) || 1);
function ticks(lo, hi, n = 4, minStep = 0) {
  let step = 1000;
  for (const s of [0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000]) if (s >= minStep && (hi - lo || 1) / s <= n) { step = s; break; }
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(Number(v.toFixed(6)));
  return out;
}
function chartSvg(w, hgt) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${hgt}`); s.setAttribute("class", "chart"); s.setAttribute("role", "group"); // marks inside are focusable
  return s;
}
// y axis with recessive grid lines; x labels are drawn by each chart
function yAxis(svg, y, vals, x0, x1, label = v => v) {
  for (const v of vals) {
    el("line", { x1: x0, x2: x1, y1: y(v), y2: y(v), class: "grid" }, svg);
    el("text", { x: x0 - 6, y: y(v) + 3, "text-anchor": "end" }, svg).textContent = label(v);
  }
  el("line", { x1: x0, x2: x1, y1: y(vals[0]), y2: y(vals[0]), class: "axis" }, svg);
}
const mark = (svg, tag, attrs, tip) => el(tag, { ...attrs, class: `mark ${attrs.class ?? ""}`, tabindex: 0, role: "img", "aria-label": tip }, svg, tip);
function legendRow(items) {
  return h("div", { className: "legend" }, ...items.map(([shape, cls, label]) => {
    const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 14 14"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = shape === "square" ? `<rect x="2" y="2" width="10" height="10" class="${cls}"/>` : shape === "hatch" ? `<rect x="1" y="1" width="12" height="12" fill="url(#hatch)"/>`
      : shape === "line" ? `<path d="M1 7h12" class="${cls}" stroke-width="2"/>` : `<circle cx="7" cy="7" r="5" class="${cls}"/>`;
    s.classList.add("chart", "swatch");
    return h("span", {}, s, label);
  }));
}
// A chart card: title, subtitle, the chart or its table (toggle), a plain-words caption.
function chartCard(title, subtitle, caption, svg, rows, extra = []) {
  if (svg.tagName === "svg") svg.setAttribute("aria-label", `${title}: ${subtitle}`);
  const body = h("div", {}, svg, ...extra);
  const card = h("div", { className: "chart-card" });
  const tableBtn = h("button", { type: "button", className: "state" }, "Table"), chartBtn = h("button", { type: "button", className: "state" }, "Chart");
  const toggle = h("div", { className: "seg compact", role: "group", ariaLabel: `${title}: chart or table` }, chartBtn, tableBtn);
  const show = asTable => {
    chartBtn.setAttribute("aria-pressed", !asTable); tableBtn.setAttribute("aria-pressed", asTable);
    body.replaceChildren(...(asTable ? [rows.length ? table(rows, caption) : empty("No values.")] : [svg, ...extra]));
  };
  chartBtn.onclick = () => show(false); tableBtn.onclick = () => show(true);
  show(false);
  card.append(h("div", { className: "head" }, h("div", {}, h("h3", {}, title), h("div", { className: "subtitle" }, subtitle)), rows ? toggle : ""), body,
    h("p", { className: "caption" }, caption));
  return card;
}

// ---- charts (#283 to #288) ----
function recallChart(rows) {
  const w = 360, hgt = 190, m = { l: 40, r: 10, t: 10, b: 34 }, bins = [...new Set(rows.map(r => r.length_bin))], seas = [...new Set(rows.map(r => r.sea_state))];
  const svg = chartSvg(w, hgt), y = lin(0, 1, hgt - m.b, m.t), band = (w - m.l - m.r) / bins.length;
  yAxis(svg, y, [0, 0.25, 0.5, 0.75, 1], m.l, w - m.r, v => pct(v));
  bins.forEach((b, i) => { el("text", { x: m.l + band * (i + 0.5), y: hgt - m.b + 16, "text-anchor": "middle" }, svg).textContent = `${b} m`; });
  el("text", { x: m.l + (w - m.l - m.r) / 2, y: hgt - 4, "text-anchor": "middle" }, svg).textContent = "boat length";
  for (const r of rows) {
    const i = bins.indexOf(r.length_bin), k = seas.indexOf(r.sea_state), cx = m.l + band * (i + 0.5) + (k - (seas.length - 1) / 2) * 12, cls = k ? "s2" : "s1";
    if (!r.n || r.recall === null) { el("text", { x: cx, y: y(0) - 4, "text-anchor": "middle" }, svg, `${r.length_bin} m, ${r.sea_state}: no boats`).textContent = "–"; continue; }
    const tip = `${r.length_bin} m, ${r.sea_state} sea: ${r.detected} of ${r.n} seen (${pct(r.recall)}), 95% range ${pct(r.lo)} to ${pct(r.hi)}`;
    el("line", { x1: cx, x2: cx, y1: y(r.lo), y2: y(r.hi), class: `whisker ${cls}` }, svg);
    if (k) mark(svg, "rect", { x: cx - 4, y: y(r.recall) - 4, width: 8, height: 8, class: cls }, tip);
    else mark(svg, "circle", { cx, cy: y(r.recall), r: 4.5, class: cls }, tip);
  }
  return chartCard("Chance of seeing a boat that is there", "Recall by boat length and sea state, with the 95% range",
    "Small boats and rough seas are often missed: that is why rough passes count as unobserved for small boats.", svg, rows,
    [legendRow(seas.map((s, k) => [k ? "square" : "circle", k ? "s2" : "s1", `${s} sea`]))]);
}

function calibrationChart(rows, brier) {
  const w = 360, hgt = 200, m = { l: 40, r: 10, t: 10, b: 34 }, svg = chartSvg(w, hgt);
  const x = lin(0, 1, m.l, w - m.r), y = lin(0, 1, hgt - m.b, m.t), maxN = Math.max(...rows.map(r => r.n), 1);
  yAxis(svg, y, [0, 0.5, 1], m.l, w - m.r, v => pct(v));
  for (const v of [0, 0.5, 1]) el("text", { x: x(v), y: hgt - m.b + 16, "text-anchor": "middle" }, svg).textContent = pct(v);
  el("text", { x: (m.l + w - m.r) / 2, y: hgt - 4, "text-anchor": "middle" }, svg).textContent = "predicted probability";
  el("line", { x1: x(0), y1: y(0), x2: x(1), y2: y(1), class: "ref" }, svg, "Perfectly honest: predicted equals observed");
  for (const r of rows)
    mark(svg, "circle", { cx: x(r.mean_pred), cy: y(r.observed), r: 3 + (6 * r.n) / maxN, class: "s1" },
      `Predicted ${pct(r.mean_pred)}, observed ${pct(r.observed)}, ${r.n} candidates`);
  return chartCard("Are the probabilities honest?", `Predicted against observed share, per bin · Brier ${fmt(brier, 3)} (lower is better)`,
    "Dots on the dashed line mean the probabilities can be taken at face value; dot size shows how many candidates are in the bin.", svg, rows);
}

// Forecast skill per event type and model: the mean over backtest folds with its min-to-max range (validate's
// shape); a plain `skill` column per fold also works.
function skillChart(rows) {
  const ranged = "mean" in rows[0], val = r => (ranged ? r.mean : r.skill ?? null);
  const label = r => (ranged ? `${r.event_type ?? ""} · ${r.model ?? ""}` : String(r.fold ?? ""));
  if (!rows.some(r => typeof val(r) === "number")) return chartCard("Forecast skill", "From the backtest", "Above 0 beats assuming every cell is average.", empty("No skill values in the report."), rows);
  const w = 360, row = 30, m = { l: 118, r: 14, t: 6, b: 26 }, hgt = m.t + m.b + row * rows.length, svg = chartSvg(w, hgt);

  for (const t of xt) {

  rows.forEach((r, i) => {

// Gap-aware line: a null breaks the line (a day not observed is never drawn as 0).
function gapLine(svg, pts, cls) {
  let d = "";
  let open = false;
  for (const p of pts) { if (p === null) { open = false; continue; } d += `${open ? "L" : "M"}${p[0]},${p[1]}`; open = true; }
  if (d) el("path", { d, class: cls }, svg);
}
function weekBand(svg, daily, x, top, bottom) {
  const first = daily.findIndex(d => isoWeek(d.date) === view.week);
  if (first < 0) return;
  const last = daily.length - 1 - [...daily].reverse().findIndex(d => isoWeek(d.date) === view.week);
  el("rect", { x: x(first) - 4, y: top, width: x(last) - x(first) + 8, height: bottom - top, class: "band" }, svg, `Week ${view.week}, shown on the map`);
}
// The ISO week label of a date, from the snapshot's own list of weeks (formatting only).
function isoWeek(dateStr) {
  const i = Math.floor((Date.parse(dateStr) - Date.parse(snap.cells.daily[0].date)) / 86400000 / 7);
  return snap.meta.weeks[Math.max(0, Math.min(snap.meta.weeks.length - 1, i))];
}
function dateAxis(svg, daily, x, yb) {
  daily.forEach((d, i) => { if (i % 7 === 0) el("text", { x: x(i), y: yb + 16, "text-anchor": "start" }, svg).textContent = `${isoWeek(d.date).slice(5)} · ${d.date.slice(5)}`; });
}

function trendChart(daily) {

  const x = lin(0, daily.length - 1, m.l + 4, w - m.r - 4), yt = ticks(0, hi, 4, 1), y = lin(0, yt[yt.length - 1], hgt - m.b, m.t); // whole cells

  dateAxis(svg, daily, x, hgt - m.b);
  gapLine(svg, daily.map((d, i) => (d.unusual_cells === null ? null : [x(i), y(d.unusual_cells)])), "line");
  daily.forEach((d, i) => {
    if (d.unusual_cells === null) { el("text", { x: x(i), y: y(0) - 4, "text-anchor": "middle" }, svg, `${d.date}: no scored cells (not observed)`).textContent = "·"; return; }
    mark(svg, "circle", { cx: x(i), cy: y(d.unusual_cells), r: 3, class: "s1" }, `${d.date}: ${d.unusual_cells} cells rated unusual (U ≥ ${AGREE_U})`);
    if (d.flagged_cells) mark(svg, "rect", { x: x(i) - 3.5, y: y(d.flagged_cells) - 3.5, width: 7, height: 7, class: "s2" }, `${d.date}: ${d.flagged_cells} cells flagged after correcting for many tests`);
  });
  return chartCard("Unusual cells per day", `Cells the detectors rate U ≥ ${AGREE_U}, and cells flagged · ${daily[0].date} to ${daily[daily.length - 1].date}`,
    "A gap means no cell was scored that day, not that nothing happened. The shaded week is the one on the map.",
    svg, daily.map(d => ({ date: d.date, unusual_cells: d.unusual_cells, flagged_cells: d.flagged_cells })),

function coverageChart(daily) {
  const w = 520, hgt = 200, m = { l: 40, r: 10, t: 10, b: 28 }, svg = chartSvg(w, hgt);
  const x = lin(0, daily.length - 1, m.l + 6, w - m.r - 6), y = lin(0, 1, hgt - m.b, m.t), bw = Math.max(3, ((w - m.l - m.r) / daily.length) * 0.7);

function siteTimeline(s) {

function scheduleChart(asset, stops, budget) {

// A radio group with roving focus: arrow keys move, Enter or a click selects (WAI-ARIA radio pattern).
function radioGroup(box, items, current, onSelect, cls = "") {
  box.replaceChildren(...items.map(([value, label, iconName]) => {
    const b = h("button", { type: "button", className: `state ${cls}`.trim() });
    b.setAttribute("role", "radio");
    b.dataset.value = value;
    b.innerHTML = iconName ? icon(iconName) : "";
    b.append(label);
    b.onclick = () => select(value, true);
    return b;
  }));
  const buttons = [...box.children];
  function select(value, fire) {
    for (const b of buttons) { const on = b.dataset.value === value; b.setAttribute("aria-checked", on); b.tabIndex = on ? 0 : -1; }
    if (fire) onSelect(value);
  }
  box.onkeydown = e => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    const i = buttons.indexOf(document.activeElement), next = buttons[(i + step + buttons.length) % buttons.length];
    next.focus(); select(next.dataset.value, true);
  };
  select(current, false);
  return select;
}

let selectWeek = () => {};

function setTheme(pick) {
  try { localStorage.setItem("np-theme", pick); } catch (e) { /* the choice lasts for this visit only */ }
  document.documentElement.dataset.pick = pick;
  const dark = pick === "dark" || (pick === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.mode = dark ? "dark" : "light";
}

function setupControls() {
  radioGroup(document.getElementById("theme"), [["light", "", "light"], ["dark", "", "dark"], ["auto", "", "auto"]],
    document.documentElement.dataset.pick, setTheme);
  for (const b of document.querySelectorAll("#theme button")) b.setAttribute("aria-label", `${b.dataset.value} theme`);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (document.documentElement.dataset.pick === "auto") setTheme("auto"); });
  radioGroup(document.getElementById("map"), Object.entries(MAPS).map(([k, m]) => [k, m.title]), view.map,
    k => { view.map = k; if (snap) { fadeHeat(() => drawHeatmap(view.map, view.week)); } });
  for (const b of document.querySelectorAll("#map button")) { b.title = MAPS[b.dataset.value].unit; b.disabled = true; }
  const symbols = {
    backdrop: '<rect x="3" y="5" width="18" height="14" rx="2" class="backdrop-sym"/>',
    inshore: '<rect x="3" y="5" width="18" height="14" fill="none" class="inshore" stroke-width="2"/>',
    lane: '<rect x="3" y="5" width="18" height="14" fill="url(#lane)" class="lane-line-svg" stroke-width="0"/><path d="M3 8h18M3 12h18M3 16h18" class="lane-line-svg" stroke-width="1.2"/>',
    sites: '<circle cx="12" cy="12" r="7" class="site flagged"/>',
    followup: '<path d="M12 4l8 8-8 8-8-8z" class="diamond" stroke-width="2"/>',
    agreement: '<circle cx="6" cy="12" r="2.5" class="dot"/><circle cx="12" cy="12" r="2.5" class="dot"/><circle cx="18" cy="12" r="2.5" class="dot"/>',
    piers: '<rect x="7" y="7" width="10" height="10" class="pier"/>',
    routes: '<path d="M2 8h20" class="route"/><path d="M2 16h20" class="route aircraft"/>',
  };
  const tg = document.getElementById("toggles");
  tg.replaceChildren(...OVERLAYS.map(([id, label]) => {
    const b = h("button", { type: "button", id: "t-" + id, className: "chip state", disabled: true });
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${symbols[id]}</svg>`;
    b.append(label);
    b.onclick = () => {
      const on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on);
      const g = document.getElementById("ov-" + id);
      if (g) g.style.display = on ? "" : "none";
      if (id === "backdrop") seeThrough();
    };
    return b;
  }));
  document.getElementById("about").innerHTML = icon("info");
  document.getElementById("prev").innerHTML = icon("prev");
  document.getElementById("next").innerHTML = icon("next");
  setReplay(false);
  setupMapView();
  addEventListener("scroll", () => document.getElementById("appbar").classList.toggle("scrolled", scrollY > 4), { passive: true });
}

function enableControls() {
  selectWeek = radioGroup(document.getElementById("week"), snap.meta.weeks.map(w => [w, w]), view.week, onWeekChange, "chip");
  for (const b of document.querySelectorAll("#map button, #toggles button, #prev, #next, #play, #about")) b.disabled = false;
  document.getElementById("t-backdrop").hidden = !backdrop();
  seeThrough();
  document.getElementById("prev").onclick = () => { setReplay(false); stepWeek(-1); };
  document.getElementById("next").onclick = () => { setReplay(false); stepWeek(1); };
  document.getElementById("play").onclick = () => setReplay(!timer);
  document.getElementById("more").onclick = () => { view.more = !view.more; drawSiteList(); };
  const dlg = document.getElementById("aboutDlg"), m = snap.meta;
  document.getElementById("about").onclick = () => {
    const rows = [["Data", m.data_label], ["As of (T)", m.T], ["Weeks shown", m.weeks.join(", ")], ["Generated", m.generated_utc],
      ["Region", `${m.region.lon_min}° to ${m.region.lon_max}°, ${m.region.lat_min}° to ${m.region.lat_max}°`], ["Config hash", m.config_hash]];
    document.getElementById("aboutList").replaceChildren(...rows.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, String(v))]));
    dlg.showModal();
  };
  document.getElementById("aboutClose").onclick = () => dlg.close();
}

function showError() {
  const b = document.getElementById("banner");
  b.textContent = "No snapshot";
  const a = document.getElementById("alert");
  a.innerHTML = icon("warning");
  a.append(h("div", {}, h("strong", {}, "No snapshot found. "), "Run ", h("code", {}, "make sim"), " and ", h("code", {}, "make all"), ", then reload this page."));
  a.hidden = false;
  document.getElementById("figures").hidden = true;
  for (const id of ["legend", "sites", "plan", "piers", "validation", "trends"]) document.getElementById(id).replaceChildren(empty("Waiting for a snapshot.", "info"));
}

(async () => {
  setupControls();
  try { snap = await loadSnapshot(); }
  catch (e) { showError(); return; }
  view.week = snap.meta.week;
  setExtent(); enableControls(); drawBasemap(); drawBanner(); drawFigures(); drawHeatmap(view.map, view.week);
  drawOverlays(true); drawSiteList(); drawPlan(); drawPiers(); drawValidation(); drawTrends(); drawFooter();
})();
</script>
</body>
</html>
