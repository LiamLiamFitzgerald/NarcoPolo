name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 12 --model claude-sonnet-5-5"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The branch is ${{ github.head_ref }}; its module is the part after "mod/" (for example mod/p4/12 is P4).

            Read AGENTS.md, then docs/specs/<MODULE>.md, and only the parts of docs/shared.md you need.
            Check the diff against them:
            1. Every Warning and "Must not" in the module spec: is it respected? Name each one you checked.
            2. Function names and signatures match the spec's pseudo-codebase block.
            3. No unobserved-as-zero, no fitting on data after the cut-off, no dB arithmetic where linear power is required.
            4. Every formula change names a simulator test that recovers a known answer.
            5. No vessel or person identifiers, no secrets, no hard-coded numbers that belong in config.yaml.
            6. The "Review passes and fixes" table in docs/shared.md overrides older spec wording.

            Post one concise review comment: blocking problems first, then suggestions. Do not push commits and do not approve or merge.
